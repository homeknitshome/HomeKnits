<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.json">
<title>HomeKnits — Knitwear Shop</title>
<style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#24211e;--muted:#746d65;--accent:#8b5e3c;--line:#e6ded5}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(247,243,238,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:auto;padding:16px 22px;display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:10px}.logo{display:flex;align-items:center}.logo img{height:48px;width:48px;object-fit:cover;border-radius:10px}.brand-name{font-size:25px;font-weight:800;letter-spacing:-1px;color:var(--ink)}.logo span{color:var(--accent)}
.search{flex:1;max-width:500px;margin:auto;position:relative}.search input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:15px}
.cartbtn{border:0;background:var(--ink);color:#fff;border-radius:13px;padding:12px 16px;cursor:pointer}.count{background:#d9a46c;border-radius:99px;padding:2px 7px;margin-left:5px;color:#241a12}
.hero{max-width:1180px;margin:28px auto;padding:46px 28px;border-radius:28px;background:linear-gradient(135deg,#dfd0bf,#f4e9dc);display:grid;grid-template-columns:1.25fr .75fr;gap:25px;align-items:center}
.hero h1{font-size:clamp(40px,6vw,70px);line-height:.95;margin:0 0 18px;letter-spacing:-3px}.hero p{font-size:18px;color:#5e554d;max-width:560px}.hero button{padding:14px 21px;border:0;border-radius:13px;background:var(--ink);color:white;font-weight:700;cursor:pointer}.hero-art{min-height:230px;border-radius:25px;background:radial-gradient(circle at 50% 40%,#b78258 0 18%,transparent 19%),linear-gradient(145deg,#8c6246,#d8b28e);display:flex;align-items:end;justify-content:center;color:#fff;font-size:22px;font-weight:700;padding:22px}
.wrap{max-width:1180px;margin:35px auto;padding:0 22px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:white;cursor:pointer}.chip.active{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:var(--card);border:1px solid var(--line);border-radius:19px;overflow:hidden;position:relative}.pic{height:245px;display:flex;align-items:center;justify-content:center;font-size:66px}.p1{background:#eadbd0}.p2{background:#d9dfd4}.p3{background:#ded8e6}.p4{background:#e8d6bb}.p5{background:#d7d8d1}.p6{background:#e5cfc7}.p7{background:#d8dfe5}.p8{background:#e1d4c5}
.info{padding:15px}.name{font-weight:750}.meta{color:var(--muted);font-size:13px;margin:5px 0}.price{font-weight:800;margin-top:9px}.add{width:100%;margin-top:11px;padding:11px;border:0;border-radius:11px;background:#f0e9e2;cursor:pointer;font-weight:700}.add:hover{background:#e6d9cc}
.empty{text-align:center;padding:50px;color:var(--muted);grid-column:1/-1}
.drawer{position:fixed;right:-420px;top:0;width:min(420px,100%);height:100%;background:#fff;z-index:10;box-shadow:-8px 0 30px #0002;padding:22px;transition:.3s;display:flex;flex-direction:column}.drawer.open{right:0}.drawerhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:9px;padding:8px;cursor:pointer}.cartitems{flex:1;overflow:auto;margin:15px 0}.cartitem{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.mini{width:65px;height:65px;border-radius:12px;display:grid;place-items:center;font-size:28px}.qty{display:flex;align-items:center;gap:8px;margin-top:6px}.qty button{border:1px solid var(--line);background:#fff;border-radius:7px;width:25px;height:25px}.checkout{padding:14px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:800;margin:15px 0}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero-art{display:none}}
@media(max-width:520px){.nav{gap:10px}.search{order:3;flex-basis:100%}.nav{flex-wrap:wrap}.grid{grid-template-columns:1fr 1fr}.pic{height:190px}.toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>

<section class="hero"><div><div style="font-weight:800;color:#8b5e3c">AUTUMN / WINTER 2026</div><h1>Warm looks,<br>beautifully knitted.</h1><p>Soft sweaters, cozy cardigans and timeless knitwear made for everyday comfort.</p><button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop collection</button></div><div class="hero-art">Cozy Knit Collection</div></section>

<main class="wrap" id="shop"><div class="toolbar"><h2 style="margin:0">Shop knitwear</h2><div class="filters"><button class="chip active" data-cat="All">All</button><button class="chip" data-cat="Sweaters">Sweaters</button><button class="chip" data-cat="Cardigans">Cardigans</button><button class="chip" data-cat="Accessories">Accessories</button></div></div><div class="grid" id="grid"></div></main>

<aside class="drawer" id="drawer"><div class="drawerhead"><h2>Your cart</h2><button class="close" onclick="toggleCart()">✕</button></div><div class="cartitems" id="cartitems"></div><div class="total"><span>Total</span><span id="total">Rs 0</span></div><button class="checkout" onclick="checkout()">Proceed to checkout</button></aside>

<script>
const products=[
{id:1,name:"Alpine Cable Sweater",cat:"Sweaters",price:5490,emoji:"🧶",c:"p1"},
{id:2,name:"Moss Oversized Knit",cat:"Sweaters",price:4990,emoji:"🧥",c:"p2"},
{id:3,name:"Luna Soft Cardigan",cat:"Cardigans",price:6290,emoji:"🧶",c:"p3"},
{id:4,name:"Heritage Wool Pullover",cat:"Sweaters",price:6990,emoji:"🧥",c:"p4"},
{id:5,name:"Ribbed Everyday Cardigan",cat:"Cardigans",price:5790,emoji:"🧶",c:"p5"},
{id:6,name:"Cloud Knit Scarf",cat:"Accessories",price:2490,emoji:"🧣",c:"p6"},
{id:7,name:"Harbor Zip Knit",cat:"Sweaters",price:5890,emoji:"🧥",c:"p7"},
{id:8,name:"Fireside Knit Beanie",cat:"Accessories",price:1990,emoji:"🧢",c:"p8"}];
let cart={}, category="All";
const money=n=>"Rs "+n.toLocaleString("en-PK");
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>(category==="All"||p.cat===category)&&p.name.toLowerCase().includes(q));
 document.getElementById("grid").innerHTML=list.length?list.map(p=>`<article class="product"><div class="pic ${p.c}">${p.emoji}</div><div class="info"><div class="name">${p.name}</div><div class="meta">${p.cat} · Soft knit</div><div class="price">${money(p.price)}</div><button class="add" onclick="add(${p.id})">Add to cart</button></div></article>`).join(""):`<div class="empty">No knitwear found. Try another search.</div>`;
}
function add(id){cart[id]=(cart[id]||0)+1;updateCart()}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];updateCart()}
function updateCart(){
 let ids=Object.keys(cart), total=0, count=0;
 document.getElementById("cartitems").innerHTML=ids.length?ids.map(id=>{let p=products.find(x=>x.id==id),q=cart[id];total+=p.price*q;count+=q;return `<div class="cartitem"><div class="mini ${p.c}">${p.emoji}</div><div style="flex:1"><b>${p.name}</b><div>${money(p.price)}</div><div class="qty"><button onclick="change(${p.id},-1)">−</button>${q}<button onclick="change(${p.id},1)">+</button></div></div></div>`}).join(""):`<div class="empty">Your cart is empty.</div>`;
 document.getElementById("total").textContent=money(total);document.getElementById("count").textContent=count;
}
function toggleCart(){document.getElementById("drawer").classList.toggle("open")}
function checkout(){if(!Object.keys(cart).length)return alert("Your cart is empty.");alert("Demo checkout: connect your payment gateway and delivery details here.");}
document.getElementById("search").addEventListener("input",render);
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");category=b.dataset.cat;render()});
render();updateCart();
</script>
</body></html>
